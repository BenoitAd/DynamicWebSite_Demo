version: '3.9'

services:
  web:
    build: .
    container_name: dynamic_website_store
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_NAME: ecommerce_demo
      DB_USER: user
      DB_PASS: password

  db:
    image: mysql:8.0
    container_name: dynamicwebsite_db
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: ecommerce_demo
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - db_data:/var/lib/mysql  # ✅ Active la persistance des données
      - ./database:/docker-entrypoint-initdb.d  # Assure-toi que ce dossier contient des fichiers SQL
    ports:
      - "3306:3306"

volumes:
  db_data:
