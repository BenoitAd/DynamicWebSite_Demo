version: '3.9'

services:
  web:
    build: .
    container_name: dynamic_website_store
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy  # wait for MySQL to be ready
    environment:
      DB_HOST: db
      DB_NAME: ecommerce_demo
      DB_USER: user
      DB_PASS: password
      DB_PORT: 3306  # Special port

  db:
    image: mysql:8.0
    container_name: dynamicwebsite_db
    restart: unless-stopped  # Start again the docker if it crashes
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: ecommerce_demo
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - db_data:/var/lib/mysql  # Data Persistance
      - ./database:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    healthcheck:  # wait for mysql to be ready before the app starts
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s

volumes:
  db_data:
