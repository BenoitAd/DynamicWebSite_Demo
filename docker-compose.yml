version: '3.9'

services:
  web:
    build: .
    container_name: dynamic_website_store
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db  # Nom du service MySQL dans Docker
      DB_NAME: ecommerce_demo
      DB_USER: user
      DB_PASS: password
      DB_PORT: 3306  # Port MySQL ou PostgreSQL selon l'environnement

  db:
    image: mysql:8.0
    container_name: dynamicwebsite_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: ecommerce_demo
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - db_data:/var/lib/mysql
      - ./database/mysql:/docker-entrypoint-initdb.d  # Utilisation du répertoire MySQL pour init DB
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s

volumes:
  db_data:
